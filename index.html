<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="./css/style.min.css" />
		<link rel="stylesheet" href="./css/custom.css" />
		<title>Portfolio UI</title>
	</head>
	<body>
		<!-- HEADER -->
		<header class="header">
			<div class="container">
				<nav class="header__nav">
					<ul class="header__list">
						<li class="header__item">
							<a href="index.html" class="header__link active">Home</a>
						</li>
						<li class="header__item">
							<a href="html/works.html" class="header__link">Works</a>
						</li>
						<li class="header__item">
							<a href="html/blog.html" class="header__link">Blog</a>
						</li>
						<li class="header__item">
							<a href="html/contacts.html" class="header__link">Contact</a>
						</li>
					</ul>
				</nav>
			</div>
		</header>

		<!-- MAIN -->
		<main class="hero">
			<div class="container hero__container"></div>
		</main>

		<!-- RECENT -->
		<section class="recent">
			<div class="container recent__container">
				<h2 class="recent__subtitle">Information</h2>
				<a class="recent__link" href="html/blog.html">View all</a>
			</div>
		</section>

		<!-- ABOUT -->
		<section class="about">
			<div class="container about__container"></div>
		</section>

		<!-- FEATURED -->
		<section class="featured">
			<div class="container featured__container">
				<h2 class="featured__title">Featured works</h2>
				<div class="featured__list"></div>
			</div>
		</section>

		<!-- WORKS -->
		<section class="works">
			<div class="container works__container"></div>
		</section>

		<!-- FOOTER -->
		<footer class="footer">
			<div class="container">
				<p class="footer__text">© 2026 Ron. All rights reserved.</p>
			</div>
		</footer>

		<!-- MODAL -->
		<div class="modal">
			<div class="modal__content">
				<button class="modal__close">х</button>
				<h2 class="modal__title"></h2>
				<p class="modal__text"></p>
			</div>
		</div>

		<!-- SCRIPT -->
		<script type="module" src="./js/app.js"></script>
	</body>
</html>
